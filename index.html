<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Class 11 Computer Science | Punjab Board & PECTAA Complete Notes</title>
  <meta name="description" content="Complete, textbook-based educational notes for Class 11 Computer Science (Punjab & Lahore Board). Covering SDLC, Python Programming, Algorithms, Data Structures, Data Analytics, Cloud, Blockchain, Cyber Ethics, and Entrepreneurship.">
  <meta name="theme-color" content="#0f172a">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="print.css">
</head>
<body>

  <!-- Top Scroll Progress Indicator -->
  <div id="scrollProgressBar" aria-hidden="true"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle-btn" onclick="NavigationManager.toggleMobileMenu()" aria-label="Toggle navigation menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <a href="#/" class="brand-logo">
        <div class="brand-icon">CS</div>
        <div class="brand-info">
          <h1>Class 11 Computer Science</h1>
          <span>Punjab Board &bull; PECTAA Edition</span>
        </div>
      </a>
    </div>

    <!-- Search Input Trigger Button -->
    <div class="header-search-bar">
      <button class="search-input-trigger" onclick="SearchManager.openModal()" aria-label="Search topics and content">
        <span style="display: flex; align-items: center; gap: 0.5rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Search topics, definitions, code...</span>
        </span>
        <kbd class="search-kbd">Ctrl K</kbd>
      </button>
    </div>

    <!-- Header Actions -->
    <div class="header-right">
      <button class="header-btn" onclick="SearchManager.openModal()" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <a href="#/saved" class="header-btn" title="Saved Bookmarks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        <span id="headerSavedCount" style="display: none; background: var(--accent-teal); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 1px 6px; border-radius: 10px;"></span>
      </a>

      <button id="themeToggleBtn" class="header-btn" onclick="ThemeManager.toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
        <svg id="themeToggleIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="NavigationManager.closeMobileMenu()"></div>

  <!-- App Layout Container -->
  <div class="app-container">

    <!-- Expandable Sidebar -->
    <aside id="appSidebar" class="app-sidebar">
      <div class="sidebar-header-section">
        <div class="sidebar-title-row">
          <span class="sidebar-title">Course Syllabus</span>
          <span id="sidebarProgressPercent" class="sidebar-progress-badge">0%</span>
        </div>
        <div class="sidebar-progress-bar-wrap">
          <div id="sidebarProgressBarFill" class="sidebar-progress-bar-fill"></div>
        </div>
      </div>

      <!-- Chapter Nav Tree -->
      <ul id="sidebarNavList" class="sidebar-nav-list">
        <!-- Rendered dynamically by NavigationManager -->
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <div id="mainContentInner" class="main-content-inner">
        <!-- Rendered dynamically by App router -->
      </div>
    </main>

  </div>

  <!-- Back to Top Floating Button -->
  <button id="backToTopBtn" aria-label="Back to top" title="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <!-- Global Toast Notifications Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Search Modal -->
  <div id="searchModal" class="search-modal-backdrop" role="dialog" aria-modal="true" aria-label="Search course content">
    <div class="search-modal-box">
      <div class="search-modal-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchModalInput" class="search-modal-input" placeholder="Search chapters, topics, definitions, code..." autocomplete="off">
        <button onclick="SearchManager.closeModal()" style="color: var(--text-muted); padding: 4px;" title="Close search (Esc)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="searchResultsContainer" class="search-results-container">
        <div class="search-empty-state">
          <p>Type keywords to search chapters, topics, subtopics, definitions, and formulas...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="copy-share.js"></script>
  <script src="theme.js"></script>
  <script src="progress.js"></script>
  <script src="bookmarks.js"></script>
  <script src="search.js"></script>
  <script src="navigation.js"></script>
  <script src="app.js"></script>
</body>
</html>
